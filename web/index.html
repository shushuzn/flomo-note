<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flomo-note · 控制台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9L20 9.5v9A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/>
          <path d="M14 4v6h6"/><path d="M8 14h8"/><path d="M8 17h5"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">flomo-note</div>
        <div class="brand-sub">项目控制台</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="notes">
        <span class="nav-dot"></span>云端笔记
      </button>
      <button class="nav-item" data-view="tags">
        <span class="nav-dot"></span>标签
      </button>
      <button class="nav-item" data-view="reference">
        <span class="nav-dot"></span>参考
      </button>
      <button class="nav-item" data-view="tools">
        <span class="nav-dot"></span>能力
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="badge badge-quiet" id="conn-badge">
        <span class="badge-dot"></span><span id="conn-text">连接中…</span>
      </div>
      <p class="foot-note">读：随时现采<br>写：过闸门 + 回读验收</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title" id="page-title">云端笔记</h1>
        <p class="page-sub" id="page-sub">列 / 搜卡片：关键词 · 标签 · 起止日期 · 来源 · 是否含标签；点开读全文与相关笔记</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-refresh" title="重新读取云端与本地快照">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>
          </svg>
          刷新
        </button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="view" id="view"></div>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="drawer-kind" id="drawer-kind">memo</span>
    <button class="drawer-close" id="drawer-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<aside class="editor" id="editor" aria-hidden="true">
  <div class="editor-head">
    <div class="editor-head-left">
      <span class="editor-kind" id="editor-kind">新建笔记</span>
      <span class="badge badge-quiet" id="editor-sub">写入前须过格式与流程闸门</span>
    </div>
    <div class="editor-head-right">
      <button class="btn btn-ghost" id="btn-ed-raw" type="button">原始文本</button>
      <button class="drawer-close" id="editor-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="editor-body">
    <div class="editor-grid">
      <div class="editor-form" id="editor-form">
        <label class="field">
          <span class="field-label">标签段<em>首行。两级如 <code>#AI/RAG</code>，多个用空格分隔，每个都带 #</em></span>
          <input class="input" id="ed-tags" placeholder="#AI/RAG #思想/协调博弈" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">概念名<em>第二行。简明概括主题的名词，不以 # 开头</em></span>
          <input class="input" id="ed-concept" placeholder="马尔科夫链" autocomplete="off">
        </label>
        <label class="field field-grow">
          <span class="field-label">正文<em>首句直接写结论，不加「结论先行：」之类前缀</em></span>
          <textarea class="input textarea" id="ed-body" rows="12" spellcheck="false"></textarea>
        </label>
      </div>

      <div class="editor-raw" id="editor-raw-wrap" hidden>
        <label class="field field-grow">
          <span class="field-label">完整卡片文本<em>首行标签段 → 空行 → 概念名 → 空行 → 正文</em></span>
          <textarea class="input textarea" id="ed-raw" rows="18" spellcheck="false"></textarea>
        </label>
      </div>
    </div>

    <div class="editor-side">
      <div class="editor-preview">
        <div class="editor-preview-head">
          <span>卡片预览</span>
          <span class="count" id="ed-chars">0 字</span>
        </div>
        <div class="editor-preview-body" id="ed-preview"></div>
      </div>

      <div class="editor-actions">
        <div class="editor-gate-opts">
          <label class="editor-opt">
            <input type="checkbox" id="ed-skip-web" checked>
            非术语卡（跳过网络验证）
          </label>
          <label class="field field-verify" id="ed-verify-wrap" hidden>
            <span class="field-label">第 ② 步验证记录<em>JSON：<code>{"searched":true,"terms":[{"term":"…","query":"…","conclusion":"…"}]}</code></em></span>
            <textarea class="input textarea textarea-sm" id="ed-verify" rows="3" spellcheck="false"></textarea>
          </label>
        </div>
        <div class="editor-buttons">
          <button class="btn" id="btn-ed-check" type="button">校验</button>
          <button class="btn" id="btn-ed-gate" type="button">跑闸门</button>
          <button class="btn btn-primary" id="btn-ed-save" type="button">写入</button>
        </div>
      </div>

      <div class="editor-result" id="editor-result" hidden></div>
    </div>
  </div>
</aside>
<div class="scrim" id="scrim-editor" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
